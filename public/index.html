<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · TCG Manager</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="DNK TCG Manager">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">
  <main class="login-main">
    <section class="login-card">
      <img class="login-logo" src="/web-app-manifest-192x192.png" width="96" height="96" alt="DNK TCG Manager">
      <h1 class="sr-only">DNK TCG Manager</h1>
      <p class="subtitle">Organiza tu colección y construye tus mazos</p>

      <!-- Vista principal: login / registro / Google -->
      <div id="main-view">
        <div class="tabs" role="tablist">
          <button class="tab active" type="button" data-mode="login" role="tab">Iniciar sesión</button>
          <button class="tab" type="button" data-mode="register" role="tab">Registrarse</button>
        </div>

        <form id="auth-form" novalidate>
          <div class="field">
            <label id="identifier-label" for="identifier">Usuario o email</label>
            <input id="identifier" name="identifier" type="text" autocomplete="username" required>
          </div>

          <div class="field register-only hidden">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email">
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" minlength="8" autocomplete="current-password" required>
          </div>

          <p id="form-error" class="form-error" role="alert"></p>
          <button id="submit-btn" class="btn" type="submit">Entrar</button>
        </form>

        <!-- Se muestra solo si el servidor tiene GOOGLE_CLIENT_ID configurado -->
        <div id="google-section" class="google-section hidden">
          <div class="divider"><span>o continúa con</span></div>
          <div id="google-btn" class="google-btn"></div>
        </div>
      </div>

      <!-- Paso extra al crear una cuenta con Google: elegir nombre de usuario -->
      <form id="username-form" class="hidden" novalidate>
        <h2 class="step-title">Elige tu nombre de usuario</h2>
        <p class="step-text">
          Vas a crear una cuenta con <strong id="google-email"></strong>.
          Elige el nombre con el que aparecerás en TCG Manager.
        </p>

        <div class="field">
          <label for="google-username">Nombre de usuario</label>
          <input id="google-username" type="text" minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]{3,20}"
                 autocomplete="username" autocapitalize="off" spellcheck="false" required>
          <small class="muted">3-20 caracteres: letras, números o guion bajo (_).</small>
        </div>

        <p id="username-error" class="form-error" role="alert"></p>
        <button id="username-submit" class="btn" type="submit">Crear cuenta</button>
        <button id="username-cancel" class="btn btn-ghost step-cancel" type="button">Cancelar</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <a href="/terms">Condiciones del servicio</a>
    <a href="/privacy">Política de privacidad</a>
  </footer>

  <script src="https://accounts.google.com/gsi/client" async defer id="gsi-script"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
