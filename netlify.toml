[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/data/banlists.json"]

# Rutas limpias de la API: /api/xxx -> /.netlify/functions/xxx
[[redirects]]
  from = "/d/*"
  to = "/shared.html"
  status = 200

[[redirects]]
  from = "/api/banlists"
  to = "/.netlify/functions/banlists"
  status = 200

[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/google"
  to = "/.netlify/functions/auth-google"
  status = 200

[[redirects]]
  from = "/api/auth/config"
  to = "/.netlify/functions/auth-config"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# URLs sin extensión: las páginas se sirven como /terms, /home... (Netlify ya las
# resuelve sin ".html"). Estas reglas redirigen la versión con extensión a la limpia
# para que nunca se vea ".html" en la barra de direcciones.
# "force" es necesario porque el archivo .html existe realmente y, sin él, Netlify
# serviría el archivo en vez de aplicar la redirección.
# IMPORTANTE: no añadas reglas inversas (/terms -> /terms.html): provocarían un bucle.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/home.html"
  to = "/home"
  status = 301
  force = true

[[redirects]]
  from = "/collection.html"
  to = "/collection"
  status = 301
  force = true

[[redirects]]
  from = "/deck-builder.html"
  to = "/deck-builder"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301
  force = true

# Cabeceras de seguridad básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Manifest con su tipo MIME correcto
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# Índices de búsqueda de Yu-Gi-Oh! (public/data/ygo): ~1 MB sin comprimir por idioma.
# Se cachean 1 hora y se pueden servir hasta 1 día mientras se revalidan.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Iconos: caché de 1 día en el navegador (cambian muy rara vez)
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# JS y CSS: el navegador los reutiliza 5 min y los revalida en segundo plano hasta 1 día
# (la web tiene ~20 módulos; así no se revalidan todos en cada visita)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"
