<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · TCG Manager</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand">
      <img class="brand-logo" src="assets/img/logo.svg" alt="">
      TCG Manager
    </div>
    <p class="subtitle">Organiza tu colección y construye tus mazos</p>

    <div class="tabs" role="tablist">
      <button class="tab active" type="button" data-mode="login" role="tab">Iniciar sesión</button>
      <button class="tab" type="button" data-mode="register" role="tab">Registrarse</button>
    </div>

    <form id="auth-form" novalidate>
      <div class="field">
        <label id="identifier-label" for="identifier">Usuario o email</label>
        <input id="identifier" name="identifier" type="text" autocomplete="username" required>
      </div>

      <div class="field register-only hidden">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="current-password" required>
      </div>

      <p id="form-error" class="form-error" role="alert"></p>
      <button id="submit-btn" class="btn" type="submit">Entrar</button>
    </form>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
