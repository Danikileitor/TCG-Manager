<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi colección · TCG Manager</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="DNK TCG Manager">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/site.webmanifest">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header id="app-header" class="app-header"><a class="brand" href="/home"><img class="brand-logo" src="/favicon-96x96.png" alt="">TCG Manager</a></header>

  <main class="page-main">
    <div class="page-title">
      <h1><span id="game-name">…</span> · Mi colección</h1>
      <nav class="subnav">
        <a id="nav-collection" class="active" href="#">Colección</a>
        <a id="nav-decks" href="#">Mazos</a>
      </nav>
    </div>

    <div class="layout-two">
      <section class="panel">
        <div class="source-switch" id="view-switch" role="tablist">
          <button type="button" class="active" data-view="collection">Mi colección</button>
          <button type="button" data-view="wishlist">Wishlist</button>
        </div>
        <div id="stats" class="stats"></div>
        <div class="toolbar">
          <input id="filter-input" type="search" placeholder="Buscar en mi colección…" aria-label="Buscar en mi colección">
          <select id="sort-select" aria-label="Ordenar"></select>
          <span id="filters-mount"></span>
          <button id="transfer-btn" class="btn btn-ghost" type="button">Importar / Exportar</button>
        </div>
        <div id="filters-active"></div>
        <div id="enrich-status" class="muted enrich-status hidden" role="status"></div>
        <div id="collection-grid" class="card-grid"><div class="spinner"></div></div>
      </section>

      <aside class="panel catalog-panel">
        <h2>Añadir desde el catálogo</h2>
        <div class="field lang-field">
          <label for="lang-select">Idioma de las cartas</label>
          <select id="lang-select"></select>
          <small id="lang-note" class="muted"></small>
        </div>
        <div id="catalog-search" class="cs"></div>
        <div id="result-list" class="result-list"></div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <a href="/terms">Condiciones del servicio</a>
    <a href="/privacy">Política de privacidad</a>
  </footer>

  <script type="module" src="/js/collection.js"></script>
</body>
</html>
