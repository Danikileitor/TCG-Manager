<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi colección · TCG Manager</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="DNK TCG Manager">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="page-main">
    <div class="page-title">
      <h1><span id="game-name">…</span> · Mi colección</h1>
      <nav class="subnav">
        <a id="nav-collection" class="active" href="#">Colección</a>
        <a id="nav-decks" href="#">Mazos</a>
      </nav>
    </div>

    <div class="layout-two">
      <section class="panel">
        <h2>Mis cartas</h2>
        <div id="stats" class="stats"></div>
        <div class="toolbar">
          <input id="filter-input" type="search" placeholder="Filtrar mi colección por nombre…">
          <select id="filter-lang" aria-label="Filtrar por idioma">
            <option value="">Todos los idiomas</option>
          </select>
        </div>
        <div id="collection-grid" class="card-grid"><div class="spinner"></div></div>
      </section>

      <aside class="panel catalog-panel">
        <h2>Añadir desde el catálogo</h2>
        <div class="field lang-field">
          <label for="lang-select">Idioma de las cartas</label>
          <select id="lang-select"></select>
          <small id="lang-note" class="muted"></small>
        </div>
        <div id="catalog-search" class="cs"></div>
        <div id="result-list" class="result-list"></div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <a href="/terms">Condiciones del servicio</a>
    <a href="/privacy">Política de privacidad</a>
  </footer>

  <script type="module" src="/js/collection.js"></script>
</body>
</html>
